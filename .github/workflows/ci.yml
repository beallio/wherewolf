name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.14
      # Install Qt offscreen platform libraries required by PyQt6 under QT_QPA_PLATFORM=offscreen, as configured in tests/conftest.py.
      - name: Install Qt offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install dependencies
        # Include the spark extra: ty must resolve pyspark to type-check the optional
        # engine. The test-duckdb leg is what proves a DuckDB-only install works.
        # NOTE: no --locked. A machine-global `exclude-newer = "7 days"` in the
        # maintainer's ~/.config/uv/uv.toml stamps a relative `exclude-newer-span`
        # into uv.lock that CI cannot reproduce, so --locked can never be satisfied.
        run: ./run.sh uv sync --extra spark --dev
      - name: Lint with ruff
        run: |
          ./run.sh uv run ruff check .
          ./run.sh uv run ruff format --check .
      - name: Type check with ty
        run: ./run.sh uv run ty check . --python /tmp/wherewolf/.venv/bin/python

  test-duckdb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      # Install Qt offscreen platform libraries required by PyQt6 under QT_QPA_PLATFORM=offscreen, as configured in tests/conftest.py.
      - name: Install Qt offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install dependencies
        run: ./run.sh uv sync --dev --python ${{ matrix.python-version }}
      - name: Verify interpreter
        run: |
          actual=$(
            ./run.sh uv run --python ${{ matrix.python-version }} python -c 'import sys; print("%d.%d" % sys.version_info[:2])' | tail -1
          )
          echo "interpreter: $actual"
          test "$actual" = "${{ matrix.python-version }}" || { echo "FAIL: expected ${{ matrix.python-version }}, got $actual"; exit 1; }
      - name: Run tests
        run: ./run.sh uv run --python ${{ matrix.python-version }} pytest

  test-spark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install Qt offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Set up Java for Spark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: ./run.sh uv sync --extra spark --dev --python ${{ matrix.python-version }}
      - name: Verify interpreter
        run: |
          actual=$(
            ./run.sh uv run --python ${{ matrix.python-version }} python -c 'import sys; print("%d.%d" % sys.version_info[:2])' | tail -1
          )
          echo "interpreter: $actual"
          test "$actual" = "${{ matrix.python-version }}" || { echo "FAIL: expected ${{ matrix.python-version }}, got $actual"; exit 1; }
      - name: Run Spark tests
        run: ./run.sh uv run --python ${{ matrix.python-version }} pytest -m spark
