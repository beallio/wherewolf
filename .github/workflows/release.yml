name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.14
      - name: Install Qt offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install dependencies
        # ty resolves the optional Spark engine; do not use --locked because the
        # maintainer's relative exclude-newer-span cannot be reproduced by CI.
        run: ./run.sh uv sync --extra spark --dev --python 3.14
      - name: Lint with ruff
        run: |
          ./run.sh uv run ruff check .
          ./run.sh uv run ruff format --check .
      - name: Type check with ty
        run: ./run.sh uv run ty check . --python /tmp/wherewolf/.venv/bin/python

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install Qt offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install dependencies
        run: ./run.sh uv sync --dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: ./run.sh uv run --python ${{ matrix.python-version }} pytest

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.14
      - name: Install Qt offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install dependencies
        run: ./run.sh uv sync --dev --python 3.14
      - name: Build and smoke test installed wheel
        run: ./run.sh uv run --python 3.14 python scripts/smoke_installed_wheel.py
      - name: Build release artifacts
        run: ./run.sh uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Body: everything under this version's heading, up to the next release heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            /^## \[/               { found = 0 }
            found                  { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

          # Previous version comes from the next heading in CHANGELOG.md, not from git:
          # actions/checkout is shallow by default and carries no tags.
          previous="$(awk -v v="$version" '
            /^## \[/ {
              match($0, /\[[^]]+\]/)
              current = substr($0, RSTART + 1, RLENGTH - 2)
              if (seen) { print current; exit }
              if (current == v) seen = 1
            }' CHANGELOG.md)"

          if [ -n "$previous" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/v%s...%s\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" \
              "$previous" "${GITHUB_REF_NAME}" >> release-notes.md
          fi

          # Title: any text after the date on the heading, else the bare tag.
          title="$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {
              if (match($0, / — /)) print substr($0, RSTART + length(" — "))
              exit
            }' CHANGELOG.md)"
          if [ -n "$title" ]; then
            echo "title=${GITHUB_REF_NAME} — ${title}" >> "$GITHUB_OUTPUT"
          else
            echo "title=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wherewolf
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
