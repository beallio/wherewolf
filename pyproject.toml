[project]
name = "wherewolf"
version = "0.5.2"
description = "A production-grade, local SQL workbench for querying files (CSV, Parquet, JSON) using DuckDB or Spark."
license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSES/*"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.4",
    "fastexcel>=0.20.2",
    "polars>=1.41.2",
    "psutil>=7.2.2",
    "pyarrow>=24.0.0",
    "pyqt6>=6.8,<7",
    "pyqt6-qscintilla>=2.14,<3",
    "sqlglot>=30.11.0",
    "xlsxwriter>=3.2.9",
]

[project.optional-dependencies]
spark = [
    "pyspark>=4.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wherewolf"]

[project.scripts]
wherewolf = "wherewolf.cli:main"
wherewolf-desktop = "wherewolf.desktop.application:main"

[tool.uv]
cache-dir = "/tmp/wherewolf/.uv_cache"
# Absolute UTC instant so the lockfile is reproducible and CI can verify it with
# --locked. A bare date resolves to LOCAL midnight and differs per machine timezone.
# A relative exclude-newer (e.g. the maintainer's global "7 days") writes a
# machine-specific exclude-newer-span into uv.lock that CI cannot reproduce.
exclude-newer = "2026-07-26T00:00:00Z"
# polars 1.43.0/1.43.1 are yanked; 1.43.2 (the fix) postdates the pin.
exclude-newer-package = { polars = false, "polars-runtime-32" = false, "polars-runtime-64" = false }

[tool.ruff]
line-length = 100
cache-dir = "/tmp/wherewolf/.ruff_cache"
# ruff 0.16.0 began formatting Python code blocks embedded in Markdown, which
# rewrites historical plan and review documents. Those are records, not source.
extend-exclude = ["docs"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term -m 'not spark'"
cache_dir = "/tmp/wherewolf/.pytest_cache"
markers = [
    "spark: requires the optional Spark extra and a working Java runtime",
]

[tool.coverage.run]
data_file = "/tmp/wherewolf/.coverage"
timid = true

[dependency-groups]
dev = [
    "hatch>=1.17.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.4,<5",
    "ruff>=0.15.17",
    "ty>=0.0.49",
]
