[project]
name = "wherewolf"
version = "0.11.0"
description = "A production-grade, local SQL workbench for querying files (CSV, Parquet, JSON) using DuckDB or Spark."
license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSES/*"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.4",
    "fastexcel>=0.20.2",
    "polars>=1.41.2",
    "psutil>=7.2.2",
    "pyarrow>=24.0.0",
    "pyqt6>=6.8,<7",
    "pyqt6-qscintilla>=2.14,<3",
    "sqlglot>=30.11.0",
    "xlsxwriter>=3.2.9",
]

[project.optional-dependencies]
spark = [
    "pyspark>=4.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wherewolf"]
# Generated by hatch_build.py and gitignored; hatchling honours VCS ignores when
# selecting files, so it must be force-included or the build stamp never ships.
artifacts = ["src/wherewolf/_build_info.py"]

[tool.hatch.build.targets.sdist]
# The sdist must carry the stamp too: `uv build` builds the wheel from the
# extracted sdist, where git is unavailable to regenerate it.
artifacts = ["src/wherewolf/_build_info.py"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[project.scripts]
wherewolf = "wherewolf.cli:main"
wherewolf-desktop = "wherewolf.desktop.application:main"

[tool.uv]
cache-dir = "/tmp/wherewolf/.uv_cache"
# Absolute UTC instant so the lockfile is reproducible and CI can verify it with
# --locked. A bare date resolves to LOCAL midnight and differs per machine timezone.
# A relative exclude-newer (e.g. the maintainer's global "7 days") writes a
# machine-specific exclude-newer-span into uv.lock that CI cannot reproduce.
exclude-newer = "2026-07-26T00:00:00Z"
# polars 1.43.0/1.43.1 are yanked; 1.43.2 (the fix) postdates the pin.
# cryptography 50.0.0 patches a PKCS#7 Bleichenbacher oracle (GHSA, high) and was
# published 2026-07-31, after the pin. It is a dev-only transitive dependency
# (hatch -> keyring -> secretstorage), but leaving it pinned also made every
# Dependabot run fail to resolve, which hid any future alert.
exclude-newer-package = { polars = false, "polars-runtime-32" = false, "polars-runtime-64" = false, pyludusavi = false, cryptography = false }

[tool.ruff]
line-length = 100
cache-dir = "/tmp/wherewolf/.ruff_cache"
# ruff 0.16.0 began formatting Python code blocks embedded in Markdown, which
# rewrites historical plan and review documents. Those are records, not source.
extend-exclude = ["docs"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term -m 'not spark'"
cache_dir = "/tmp/wherewolf/.pytest_cache"
markers = [
    "spark: requires the optional Spark extra and a working Java runtime",
]

[tool.coverage.run]
data_file = "/tmp/wherewolf/.coverage"
timid = true

[tool.ty.rules]
# pyspark is an optional extra, so ty sees two different worlds. Without the extra
# installed, `from pyspark.sql import ...` is an unresolved-import; with it, that
# import resolves but `SparkSession.builder` does not (pyspark declares it as a
# classproperty ty cannot follow), producing unresolved-attribute instead. The two
# configurations therefore need opposite `ty: ignore` comments, and whichever set is
# not needed is reported as an unused directive. CI's lint leg installs
# `--extra spark`; a plain `uv sync` does not. Silencing unused-directive reports is
# what lets both suppressions coexist. Do not remove the `ty: ignore` comments in
# src/wherewolf/execution/spark_engine.py or tests/conftest.py because they look
# unused locally — they are load-bearing in the other configuration.
unused-ignore-comment = "ignore"

[dependency-groups]
dev = [
    "hatch>=1.17.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.4,<5",
    "ruff>=0.15.17",
    "ty>=0.0.49",
]
